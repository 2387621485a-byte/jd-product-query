<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品数据查询系统</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">
  
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3M4 17v3h16v-3M9 10h6v4H9z" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="brand-copy"><h1>产品数据查询</h1><p>Product Intelligence Workspace</p></div>
    </div>
    <div class="topbar-actions">
      <label class="btn btn-primary" title="支持多选文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        导入表格
        <input type="file" id="fileInput" accept=".xlsx,.xls" multiple hidden>
      </label>
      <button class="btn btn-outline" id="manageBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        数据管理 (<span id="tableCount">0</span>)
      </button>
      <button class="btn btn-danger-outline" id="clearAllBtn" title="清空所有本地数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
        清空缓存
      </button>
    </div>
  </header>

  <!-- 全局进度条 -->
  <div id="progress" class="progress-container" hidden>
    <div class="progress-info">
      <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <span id="progressText">正在解析文件...</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <main class="main-layout">
    
    <!-- 左侧：已导入表格清单 -->
    <aside class="sidebar" id="sidebar" hidden>
      <div class="sidebar-header">
        <h2>已导入数据 (<span id="sidebarCount">0</span>)</h2>
        <button class="icon-btn" id="sidebarToggle" title="收起列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
      </div>
      <div class="sidebar-content">
        <ul class="file-list" id="tableList"></ul>
      </div>
    </aside>
    
    <div class="sidebar-reopen-wrap" id="sidebarReopenWrap" hidden>
      <button class="sidebar-reopen" id="sidebarReopen" title="展开数据列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- 右侧主内容区 -->
    <section class="workspace">
      <div class="workspace-heading"><div><h2>产品表查询</h2><p>按归档日期筛选数据，并通过 SKU 或物料号精准检索。</p></div><div class="workspace-status"><span class="status-dot"></span>本地数据模式</div></div>
      <!-- 搜索控制面板 -->
      <div class="panel search-panel">
        <div class="search-form">
          <div class="form-group select-group">
            <label>年份筛选</label>
            <div class="select-wrapper">
              <select id="yearSelect"></select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
          
          <div class="form-group select-group">
            <label>月份筛选</label>
            <div class="select-wrapper">
              <select id="monthSelect"></select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
          </div>
          
          <div class="form-group input-group grow">
            <label>关键字查询</label>
            <div class="input-wrapper">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="text" id="searchInput" placeholder="输入 SKU 或 物料号 (支持自动查询)" autocomplete="off">
            </div>
          </div>
          
          <div class="form-actions">
            <button class="btn btn-primary" id="searchBtn">
              查询
            </button>
          </div>
        </div>
        
        <div class="search-hint" id="matchHint"></div>
      </div>

      <!-- 查询结果展示区 -->
      <div class="panel result-panel">
        <div id="resultMeta" class="result-toolbar"></div>
        <div id="resultArea" class="result-content">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <h3>暂无查询数据</h3>
            <p>请点击右上角「导入表格」上传 .xlsx 数据文件。</p>
            <p class="text-muted">数据将安全地缓存在本地浏览器中，下次打开即用。</p>
          </div>
        </div>
      </div>
      
    </section>
  </main>
</div>

<!-- 数据管理弹窗 -->
<div class="modal-backdrop" id="manageModal" hidden>
  <div class="modal-dialog">
    <div class="modal-header">
      <h2>本地数据管理</h2>
      <button class="icon-btn close-btn" id="closeManage" title="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="modal-body" id="manageList">
      <!-- 动态填充 -->
    </div>
  </div>
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
